[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncdrop"
version = "0.1.0"
description = "Multicam audio sync that doesn't choke on iPhone footage. Drop a folder, get an AAF for Premiere."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joe Pascual" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pyaaf2>=1.7,<2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
syncdrop = "syncdrop.cli:main"

[project.urls]
Homepage = "https://github.com/joepascual/syncdrop"
Issues = "https://github.com/joepascual/syncdrop/issues"

[tool.setuptools.packages.find]
where = ["src"]
